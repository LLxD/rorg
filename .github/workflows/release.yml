name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (patch | minor | major) or exact version (e.g. 1.2.3)'
        required: true
        default: 'patch'

jobs:
  release:
    name: Publish to npm & create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Releases and push tags

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so auto-generated release notes include all commits

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # ── Tag-triggered publish ───────────────────────────────────────────────
      - name: Publish to npm (tag trigger)
        if: github.event_name == 'push'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release (tag trigger)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      # ── Manual dispatch: bump version, tag, publish ────────────────────────
      - name: Bump version (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          INPUT="${{ github.event.inputs.version }}"
          # If input is patch/minor/major use npm version, otherwise treat as exact
          if [[ "$INPUT" =~ ^(patch|minor|major)$ ]]; then
            npm version "$INPUT" -m "chore: release v%s"
          else
            npm version "$INPUT" -m "chore: release v%s"
          fi
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
        shell: bash

      - name: Push tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: git push --follow-tags

      - name: Publish to npm (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          generate_release_notes: true
